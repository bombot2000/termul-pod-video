name: Build Android APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --no-pub --platforms=android --org com.termul --project-name termul_pod_video .
          fi

      - name: Configure Android permissions and minSdk
        run: python3 tool/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER"

      - name: Publish APK Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE_SHA="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping release: a newer commit is already available on this ref."
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="build-$GITHUB_RUN_NUMBER"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create "$RELEASE_TAG" build/app/outputs/flutter-apk/app-release.apk \
              --title "Termul POD Video $RELEASE_TAG" \
              --notes "Automated APK build from commit $GITHUB_SHA. No permanent keystore is used."
          fi
