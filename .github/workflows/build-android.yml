name: Build Android APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    # A PR from a branch in this repo is already built by its push run.
    # Fork PRs still build (read-only token, no release step).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --no-pub --platforms=android --org com.termul --project-name termul_pod_video .
          fi

      - name: Configure Android permissions and minSdk
        run: python3 tool/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER"

      - name: Publish APK Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: build/app/outputs/flutter-apk/app-release.apk
        run: |
          # Do not publish a stale build if a newer commit already landed.
          # Fail open: if the API call fails, publish rather than skip silently.
          REMOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$REMOTE_SHA" ]; then
            echo "::warning::Could not read the remote branch head; publishing anyway."
          elif [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release: a newer commit is already available on $GITHUB_REF_NAME."
            exit 0
          fi

          RELEASE_TAG="build-$GITHUB_RUN_NUMBER"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # --target pins the tag to the commit that was built. Without it,
            # a new tag is created at the default branch head, which is the
            # wrong commit for builds from feature branches.
            gh release create "$RELEASE_TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Termul POD Video $RELEASE_TAG" \
              --notes "Automated APK build from $GITHUB_REF_NAME at commit $GITHUB_SHA. No permanent keystore is used (debug-signed, for internal testing)."
          fi
